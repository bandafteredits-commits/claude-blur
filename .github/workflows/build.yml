name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: gcc -O2 -shared -o motionblur.dll motionblur.c -ld3d11 -ldxgi -luuid -static-libgcc
      - run: gcc -O2 -mwindows -o cpinject.exe cpinject.c -ladvapi32 -static-libgcc
      - uses: actions/upload-artifact@v4
        with:
          name: motionblur-files
          path: |
            motionblur.dll
            cpinject.exe
